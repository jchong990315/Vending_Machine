services:
  db8:
    image: mysql/mysql-server:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Group17
      MYSQL_DATABASE: Vending_Machine
      MYSQL_ROOT_HOST: '%'
    volumes:
      - aawdat8:/var/lib/mysql
      - ./DB_construct_file/DB_init:/docker-entrypoint-initdb.d
    ports:
      - "53386:3306"
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    networks:
      - project_network
    healthcheck:
      test:
        [
          "CMD", "mysqladmin", "ping",
          "-h", "127.0.0.1", "-P", "3306",
          "-uroot", "-pGroup17"
        ]
      interval: 10s
      retries: 10
      start_period: 90s

  phpmyadmin8:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    depends_on:
      - db8
    environment:
      PMA_HOST: db8
      PMA_USER: root
      PMA_PASSWORD: Group17
    ports:
      - "50088:80"
    networks:
      - project_network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db8:
        condition: service_healthy
    environment:
      - DEBUG=1
      - DATABASE_HOST=db8
      - DATABASE_NAME=Vending_Machine
      - DATABASE_USER=root
      - DATABASE_PASSWORD=Group17
      - DATABASE_PORT=3306
    networks:
      - project_network

  frontend:
    build:
      context: ./src/frontend/vending-machine
      dockerfile: Dockerfile
    volumes:
      - ./src/frontend/vending-machine:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_BASE_URL=http://backend:8000/api
    networks:
      - project_network

volumes:
  aawdat8:
    driver: local

networks:
  project_network:
    driver: bridge
